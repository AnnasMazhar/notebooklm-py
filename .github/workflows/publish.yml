name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-test:
    name: Build wheel and run release smoke
    runs-on: ubuntu-latest
    # Smoke install pulls `[browser,dev,markdown]` extras (pytest, playwright,
    # mypy, ruff, markdownify, transitive deps). A compromised dep here is a
    # supply-chain concern but cannot mint a Trusted Publishing OIDC token,
    # because this job is not granted `id-token: write`. The publish job
    # below carries that scope and runs nothing except the trusted PyPA
    # action. See issue #820 for the threat model.
    permissions:
      contents: read

    outputs:
      # Consumed by the publish job to decide whether the shim upload runs.
      prerelease: ${{ steps.release_kind.outputs.prerelease }}

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install package for API inspection
      run: python -m pip install --disable-pip-version-check --editable .

    - name: Validate tag matches version
      run: |
        TAG_VERSION=${GITHUB_REF#refs/tags/v}
        TOML_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
        if [ "$TAG_VERSION" != "$TOML_VERSION" ]; then
          echo "Error: Tag version ($TAG_VERSION) doesn't match pyproject.toml ($TOML_VERSION)"
          exit 1
        fi
        echo "Version validated: $TOML_VERSION"

    - name: Resolve previous stable API baseline
      id: baseline
      run: |
        set -euo pipefail
        current_tag="${GITHUB_REF_NAME}"
        current_sha=$(git rev-list -n 1 "$current_tag")
        previous_tag=""
        while IFS= read -r tag; do
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] &&
            [ "$(git rev-list -n 1 "$tag")" != "$current_sha" ]; then
            previous_tag="$tag"
            break
          fi
        done < <(git tag --sort=-version:refname --merged "$current_sha")
        if [ -z "$previous_tag" ]; then
          echo "No previous stable release tag found before $current_tag." >&2
          echo "Fetch complete tag history or create a prior stable tag, then rerun the release." >&2
          exit 1
        fi
        echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"
        echo "Using previous stable API baseline: $previous_tag"

    - name: Audit public API compatibility before artifact publication
      run: |
        python scripts/audit_public_api_compat.py \
          --baseline-ref "${{ steps.baseline.outputs.previous_tag }}" \
          --check-stale

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        python -m pip install build==1.5.0

    - name: Verify shim packaging is in lockstep
      # The shims pin `==<canonical version>` and mirror every extra. Checking
      # here — before anything is built — means a stale shim fails the release
      # at its cheapest point rather than after a partial upload.
      run: python packaging/shims/generate.py --check

    - name: Classify the tag (pre-release vs final)
      # A PEP 440 pre-release suffix (aN/bN/rcN, optionally .devN/.postN)
      # decides whether the forwarding shims ship at all — see the build step
      # below for the two reasons a pre-release publishes the canonical dist
      # alone.
      id: release_kind
      run: |
        set -euo pipefail
        TAG_VERSION=${GITHUB_REF#refs/tags/v}
        if echo "$TAG_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
          echo "prerelease=false" >> "$GITHUB_OUTPUT"
          echo "Final release $TAG_VERSION — publishing all three dists."
        else
          echo "prerelease=true" >> "$GITHUB_OUTPUT"
          echo "Pre-release $TAG_VERSION — publishing the NEW names only."
        fi

    - name: Build canonical distribution
      run: |
        python -m build

    - name: Build forwarding shims
      # FINAL RELEASES ONLY — a pre-release publishes the canonical dist alone.
      #
      # Two independent reasons, either of which is sufficient:
      #
      # 1. `notebooklm-py` is the live package with real users, and turning it
      #    into a shim is the step ADR-0028 places AFTER its abort point.
      #    Publishing it early would burn a version on the production project
      #    and reroute anyone on `--pre` to a dist we may still abandon. A
      #    pre-release gains nothing from it: the point is to claim the NEW
      #    names, and `notebooklm-py` is already ours.
      # 2. Trusted Publishing is per-project. Uploading a dist whose PyPI
      #    project has no (pending) publisher is REJECTED — and because the
      #    canonical upload happens first, that failure would land *after* a
      #    successful publish, leaving a red run over a half-done release.
      #    Names without a publisher are claimed out-of-band instead; see
      #    packaging/placeholders/claim.sh.
      #
      # The full three-dist matrix is rehearsed on TestPyPI, where the
      # namespace is separate and nothing is at stake.
      if: steps.release_kind.outputs.prerelease == 'false'
      run: |
        set -euo pipefail
        python -m build --outdir dist-shims packaging/shims/gemini-notebook
        python -m build --outdir dist-shims packaging/shims/notebooklm-py

    - name: Assert the built dists carry the tag version
      # Belt-and-braces over the generator check: this reads the built
      # artifacts, so it also catches a build that picked up stale inputs.
      run: |
        set -euo pipefail
        TAG_VERSION=${GITHUB_REF#refs/tags/v}
        EXPECTED=("dist/gemini_notebook_py-${TAG_VERSION}-py3-none-any.whl")
        if [ "${{ steps.release_kind.outputs.prerelease }}" = "false" ]; then
          EXPECTED+=("dist-shims/gemini_notebook-${TAG_VERSION}-py3-none-any.whl"
                     "dist-shims/notebooklm_py-${TAG_VERSION}-py3-none-any.whl")
        fi
        for pattern in "${EXPECTED[@]}"; do
          if [ ! -f "$pattern" ]; then
            echo "Error: expected built wheel $pattern is missing"
            ls -R dist dist-shims 2>/dev/null || true
            exit 1
          fi
          echo "OK: $pattern"
        done
        # Assert the absence rather than trusting the conditional above: a
        # pre-release must not carry ANY shim, because an upload to a project
        # with no trusted publisher fails after the canonical one succeeded.
        if [ "${{ steps.release_kind.outputs.prerelease }}" = "true" ] \
           && ls dist-shims/* >/dev/null 2>&1; then
          echo "Error: pre-release built shim artifacts; they must not be published."
          ls -R dist-shims
          exit 1
        fi

    - name: Assert the shims ship no code
      if: steps.release_kind.outputs.prerelease == 'false'
      # A shim that shipped `notebooklm/` files would collide with the
      # canonical dist file-for-file — the exact hazard ADR-0028 removes.
      # Console scripts are equally forbidden: duplicate `bin/` ownership
      # corrupts the survivor on uninstall.
      run: |
        set -euo pipefail
        for wheel in dist-shims/*.whl; do
          if unzip -l "$wheel" | grep -qE ' notebooklm/'; then
            echo "Error: shim $wheel ships notebooklm/ package files"
            unzip -l "$wheel"
            exit 1
          fi
          if unzip -l "$wheel" | grep -q 'entry_points.txt'; then
            echo "Error: shim $wheel declares console scripts"
            exit 1
          fi
          echo "OK: $wheel is metadata-only"
        done

    - name: Upload distribution artifacts
      # Capture pristine wheel + sdist BEFORE any third-party code (smoke
      # install, playwright, pytest) runs against `dist/`. If we uploaded
      # after the smoke install, a compromised dev/test dep could mutate
      # `dist/` post-build, and the publish job would upload tampered bytes
      # — attested with the project's trusted OIDC identity. Uploading here
      # snapshots the build output before any attacker-controlled code has
      # touched the runner. Smoke install/test below still runs against
      # `dist/` for behavior validation but can no longer influence what
      # the publish job receives.
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # @ v7
      with:
        name: gemini-notebook-py-dist
        path: dist/
        if-no-files-found: error
        # One-day retention is intentional: publish consumes this artifact
        # immediately. See issue #829 for the recovery trade-off.
        retention-days: 1

    - name: Upload shim artifacts
      if: steps.release_kind.outputs.prerelease == 'false'
      # Same pristine-capture reasoning as above, kept as a separate artifact
      # so the publish job can upload the canonical dist first (see below).
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # @ v7
      with:
        name: gemini-notebook-py-shims
        path: dist-shims/
        if-no-files-found: error
        retention-days: 1

    - name: Install built wheel + canonical contributor extras in a clean venv
      # Canonical contributor extras (`[browser,dev,markdown]`, equivalent to
      # `[all]`) match the install path documented in `docs/installation.md`,
      # so the release smoke exercises the same surface area users will see.
      # Plain `[dev]` skipped playwright + markdownify, masking packaging bugs
      # in `[browser]`/`[markdown]` until users hit them post-release.
      run: |
        python -m venv smoke-venv
        WHEEL=$(ls dist/gemini_notebook_py-*.whl)
        smoke-venv/bin/pip install "${WHEEL}[browser,dev,markdown]"
        smoke-venv/bin/python -c "import notebooklm; print(notebooklm.__version__)"

    - name: Smoke-install each shim against the local build
      if: steps.release_kind.outputs.prerelease == 'false'
      # `--find-links` is required: the shims pin `==<version>`, and that
      # version does not exist on PyPI yet at this point in the release.
      # Installing the shim NAME (not the file) is what proves the forwarding
      # dependency actually resolves.
      run: |
        set -euo pipefail
        SHIMS=(gemini-notebook)
        if [ "${{ steps.release_kind.outputs.prerelease }}" = "false" ]; then
          SHIMS+=(notebooklm-py)
        fi
        for shim in "${SHIMS[@]}"; do
          python -m venv "shim-venv-${shim}"
          "shim-venv-${shim}/bin/pip" install \
            --find-links dist/ --find-links dist-shims/ "${shim}[mcp]"
          # The import package is permanent: both names must land on it.
          "shim-venv-${shim}/bin/python" -c "import notebooklm; print('${shim} ->', notebooklm.__version__)"
          # All six console scripts come from the canonical dist, so they must
          # be present even though the shim itself declares none.
          for cmd in notebooklm notebooklm-mcp notebooklm-server \
                     gemini-notebook gemini-notebook-mcp gemini-notebook-server; do
            test -x "shim-venv-${shim}/bin/${cmd}" || { echo "missing script ${cmd}"; exit 1; }
          done
          echo "OK: ${shim} forwards correctly"
        done

    - name: Install Playwright browser for smoke
      # `[browser]` only installs the playwright Python package; the chromium
      # binary + Linux system libs are needed for the unit-test smoke
      # (tests/unit/test_windows_compatibility.py drives sync_playwright()).
      run: |
        smoke-venv/bin/playwright install chromium
        smoke-venv/bin/playwright install-deps chromium

    - name: Run unit tests against wheel
      run: smoke-venv/bin/pytest tests/unit -q --no-cov -x

  publish:
    name: Publish to PyPI
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: release
    # Minimum-scope publish job: only the trusted PyPA action runs here. No
    # `actions/checkout`, no Python install, no third-party dependencies in
    # the runner environment — so the OIDC token request that `id-token:
    # write` enables has no co-tenant code that could exfiltrate it.
    permissions:
      id-token: write
      contents: read

    # Upload order is load-bearing (ADR-0028 step 3): each shim pins
    # `gemini-notebook-py==<version>`, so a shim published before the canonical
    # dist would be installable-but-unresolvable for as long as the gap lasts.
    # Canonical first, shims second, as separate steps so the ordering cannot be
    # lost to a glob that happens to sort the other way.
    steps:
    - name: Download canonical distribution artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # @ v8.0.1
      with:
        name: gemini-notebook-py-dist
        path: dist/

    - name: Download shim artifacts
      if: needs.build-and-test.outputs.prerelease == 'false'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # @ v8.0.1
      with:
        name: gemini-notebook-py-shims
        path: dist-shims/

    - name: Publish canonical distribution to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # @ v1.14.2
      with:
        # PEP 740 attestations: pypa/gh-action-pypi-publish generates an
        # in-toto attestation for the uploaded artifacts and publishes it
        # via PyPI's Trusted Publishing flow (OIDC, no API token).
        attestations: true

    - name: Publish forwarding shims to PyPI
      if: needs.build-and-test.outputs.prerelease == 'false'
      # Runs only after the canonical upload succeeded, so the `==` pin these
      # carry always points at something already on the index.
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # @ v1.14.2
      with:
        packages-dir: dist-shims/
        attestations: true

  prune-api-compat:
    name: Open post-tag API allowlist prune PR
    needs: publish
    runs-on: ubuntu-latest
    # This job uses its repository-write permission only for the generated
    # automation branch; the script never pushes main directly.
    permissions:
      contents: write
      pull-requests: write

    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ github.ref }}
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"

    - name: Install package for API inspection
      run: python -m pip install --disable-pip-version-check --editable .

    - name: Resolve previous stable API baseline
      id: baseline
      run: |
        set -euo pipefail
        current_tag="${GITHUB_REF_NAME}"
        current_sha=$(git rev-list -n 1 "$current_tag")
        previous_tag=""
        while IFS= read -r tag; do
          if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] &&
            [ "$(git rev-list -n 1 "$tag")" != "$current_sha" ]; then
            previous_tag="$tag"
            break
          fi
        done < <(git tag --sort=-version:refname --merged "$current_sha")
        if [ -z "$previous_tag" ]; then
          echo "No previous stable release tag found before $current_tag." >&2
          echo "Fetch complete tag history or create a prior stable tag, then rerun the release." >&2
          exit 1
        fi
        echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"
        if [[ "$current_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "baseline_ref=$current_tag" >> "$GITHUB_OUTPUT"
        else
          echo "baseline_ref=$previous_tag" >> "$GITHUB_OUTPUT"
        fi

    - name: Prune stale entries from immutable release tag
      run: |
        python scripts/audit_public_api_compat.py \
          --baseline-ref "${{ steps.baseline.outputs.baseline_ref }}" \
          --prune

    - name: Create or safely reuse automation branch and PR
      env:
        GH_TOKEN: ${{ github.token }}
        AUTOMATION_BRANCH: automation/api-compat-prune-${{ github.ref_name }}
      run: |
        set -euo pipefail
        if git diff --quiet -- scripts/api-compat-allowlist.json; then
          echo "No stale API-compat entries found; no prune PR is needed."
          exit 0
        fi

        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add scripts/api-compat-allowlist.json
        git commit -m "chore(api): prune stale compatibility allowances"
        generated_tree=$(git rev-parse HEAD^{tree})

        existing_commit=$(git ls-remote --quiet origin "refs/heads/$AUTOMATION_BRANCH" | awk 'NR == 1 {print $1}')
        if [ -n "$existing_commit" ]; then
          git fetch --no-tags origin "refs/heads/$AUTOMATION_BRANCH:refs/remotes/origin/$AUTOMATION_BRANCH"
          existing_tree=$(git rev-parse "refs/remotes/origin/$AUTOMATION_BRANCH^{tree}")
          if [ "$existing_tree" != "$generated_tree" ]; then
            echo "Automation branch $AUTOMATION_BRANCH exists with a different tree." >&2
            echo "Review or remove that human-modified branch, then rerun; no force-push was attempted." >&2
            exit 1
          fi
          pr_count=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$AUTOMATION_BRANCH" --base main --state open --json number --jq 'length')
          if [ "$pr_count" -eq 0 ]; then
            echo "Automation branch $AUTOMATION_BRANCH already exists, but no open PR was found." >&2
            echo "Open the matching PR or remove the stale automation branch, then rerun." >&2
            exit 1
          fi
          echo "Reused identical automation branch and existing PR for $AUTOMATION_BRANCH."
          exit 0
        fi

        gh auth setup-git
        git branch "$AUTOMATION_BRANCH"
        if ! git push origin "refs/heads/$AUTOMATION_BRANCH"; then
          echo "Automation branch appeared during creation; verifying its contents."
          git fetch --no-tags origin "refs/heads/$AUTOMATION_BRANCH:refs/remotes/origin/$AUTOMATION_BRANCH"
          existing_tree=$(git rev-parse "refs/remotes/origin/$AUTOMATION_BRANCH^{tree}")
          if [ "$existing_tree" != "$generated_tree" ]; then
            echo "Automation branch $AUTOMATION_BRANCH exists with a different tree." >&2
            echo "Review or remove that human-modified branch, then rerun; no force-push was attempted." >&2
            exit 1
          fi
          pr_count=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$AUTOMATION_BRANCH" --base main --state open --json number --jq 'length')
          if [ "$pr_count" -eq 0 ]; then
            echo "Automation branch $AUTOMATION_BRANCH already exists, but no open PR was found." >&2
            echo "Open the matching PR or remove the stale automation branch, then rerun." >&2
            exit 1
          fi
          echo "Reused identical automation branch and existing PR for $AUTOMATION_BRANCH."
          exit 0
        fi
        gh pr create \
          --repo "$GITHUB_REPOSITORY" \
          --head "$AUTOMATION_BRANCH" \
          --base main \
          --title "chore(api): prune stale compatibility allowances for $GITHUB_REF_NAME" \
          --body "Automated post-tag cleanup for $GITHUB_REF_NAME. This PR removes only allowlist entries that are stale against the immutable release tag; review and merge it before the next release."
