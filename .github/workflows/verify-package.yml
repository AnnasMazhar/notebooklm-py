name: Verify Package

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Package source'
        required: true
        default: 'testpypi'
        type: choice
        options:
          - testpypi
          - pypi

permissions:
  contents: read

jobs:
  verify:
    name: Verify from ${{ inputs.source }}
    runs-on: ubuntu-latest
    # Secret-bearing job (steps below reference secrets.NOTEBOOKLM_AUTH_JSON
    # + secrets.NOTEBOOKLM_MASTER_TOKEN_JSON
    # + secrets.NOTEBOOKLM_READ_ONLY_NOTEBOOK_ID for the live E2E pass). The
    # workflow is workflow_dispatch-only, so every run is human-initiated;
    # this `protected-readonly` environment requires a maintainer to approve
    # the dispatch before any secret is exposed. Non-maintainer dispatches
    # block at the approval prompt rather than acquiring tokens.
    # See docs/development.md → "Workflow secret gates".
    environment: protected-readonly

    steps:
    - uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Set up Python 3.12
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install uv
      uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # @ v7.0.0

    - name: Get version from pyproject.toml
      id: version
      run: |
        VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
        echo "version=$VERSION" >> $GITHUB_OUTPUT

    - name: Sync locked deps + non-cookies extras
      # Pull every runtime + tooling dep from `uv.lock` (the same lockfile
      # contributors install from) so the verify step exercises the full
      # non-cookies dep tree rather than whatever pip happens to resolve at
      # smoke time. `cookies` stays excluded because rookiepy has Python
      # 3.13+ install issues.
      # The published wheel itself is force-reinstalled in the next step.
      # `headless` = gpsoauth, required for the layer-4 master-token re-mint
      # that the materialized auth profile below relies on.
      run: >
        uv sync --frozen
        --extra browser
        --extra dev
        --extra markdown
        --extra mcp
        --extra server
        --extra headless

    - name: Install published wheel from TestPyPI (--no-deps)
      if: inputs.source == 'testpypi'
      shell: bash
      run: |
        # --no-deps proves the wheel was actually uploaded to TestPyPI — the
        # previous `--extra-index-url https://pypi.org/simple/` fallback would
        # silently succeed by resolving an older published version from PyPI
        # when the TestPyPI upload itself was broken or missing.
        # --reinstall replaces the editable install left behind by `uv sync`
        # with the actual built wheel under test. --no-cache + --only-binary
        # ensure we test the freshly-uploaded wheel, never a cached sdist.
        #
        # `uv pip install --python .venv/bin/python` is load-bearing: a
        # `source .venv/bin/activate && pip install …` chain falls back to
        # the runner's system pip when uv has not seeded pip into `.venv`,
        # which then writes outside the venv and leaves the editable install
        # in place — masking a broken/missing TestPyPI upload.
        uv pip install --python .venv/bin/python \
          --no-deps --reinstall --no-cache --only-binary=:all: \
          --index-url https://test.pypi.org/simple/ \
          "gemini-notebook-py==${{ steps.version.outputs.version }}"

    - name: Install published wheel from PyPI (--no-deps)
      if: inputs.source == 'pypi'
      shell: bash
      run: |
        # Symmetric with the TestPyPI step: --no-deps + --reinstall swaps the
        # locked editable install for the actual PyPI wheel without
        # disturbing the dep tree resolved from `uv.lock`. See the TestPyPI
        # step above for why `uv pip install --python .venv/bin/python` is
        # used instead of activating the venv and calling bare `pip`.
        uv pip install --python .venv/bin/python \
          --no-deps --reinstall --no-cache --only-binary=:all: \
          "gemini-notebook-py==${{ steps.version.outputs.version }}"

    - name: Verify version
      shell: bash
      run: |
        source .venv/bin/activate
        INSTALLED=$(python -c "from notebooklm import __version__; print(__version__)")
        EXPECTED="${{ steps.version.outputs.version }}"
        if [ "$INSTALLED" != "$EXPECTED" ]; then
          echo "Version mismatch: installed=$INSTALLED expected=$EXPECTED"
          exit 1
        fi
        echo "Version verified: $INSTALLED"

    - name: Verify CLI
      shell: bash
      run: |
        set -euo pipefail
        source .venv/bin/activate
        # All six ADR-0028 console scripts must run, and each must report the
        # name it was invoked as rather than the other brand's — a hardcoded
        # prog would make `gemini-notebook --version` advertise `notebooklm`.
        for cmd in notebooklm gemini-notebook; do
          "$cmd" --help > /dev/null
          out=$("$cmd" --version)
          echo "$out"
          case "$out" in
            "$cmd, version"*) ;;
            *) echo "::error::$cmd --version reported '$out', expected it to name $cmd"; exit 1 ;;
          esac
        done
        for cmd in notebooklm-mcp gemini-notebook-mcp notebooklm-server gemini-notebook-server; do
          out=$("$cmd" --help | head -1)
          echo "$out"
          case "$out" in
            "usage: $cmd"*) ;;
            *) echo "::error::$cmd --help reported '$out', expected usage for $cmd"; exit 1 ;;
          esac
        done

    - name: Verify imports
      shell: bash
      run: |
        source .venv/bin/activate
        python -c "from notebooklm import NotebookLMClient, GeminiNotebookClient, Notebook, Source, Artifact"
        python -c "
        from notebooklm import NotebookLMClient, GeminiNotebookClient
        assert GeminiNotebookClient is NotebookLMClient, 'the ADR-0028 alias must be the same class'
        "
        echo "Core imports verified"

    # ------------------------------------------------------------------
    # ADR-0028 acceptance matrix: every published name must yield a working
    # `import notebooklm`, and the shims must behave as documented. These run
    # in throwaway venvs so they cannot disturb the verified install above.
    # ------------------------------------------------------------------

    - name: Verify each published dist name installs and imports
      shell: bash
      env:
        INDEX_ARGS: ${{ inputs.source == 'testpypi' && '--index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/' || '' }}
      run: |
        set -euo pipefail
        VERSION="${{ steps.version.outputs.version }}"
        # The shims pin `gemini-notebook-py==<version>` and carry real
        # dependencies, so unlike the canonical check above these deliberately
        # resolve deps — that resolution IS what is being verified.
        for dist in gemini-notebook-py notebooklm-py gemini-notebook; do
          echo "::group::install ${dist}==${VERSION}"
          rm -rf "venv-${dist}"
          python -m venv "venv-${dist}"
          "venv-${dist}/bin/pip" install --no-cache-dir $INDEX_ARGS "${dist}[mcp]==${VERSION}"
          # There is no second import path: the import package is permanent.
          got=$("venv-${dist}/bin/python" -c "import notebooklm; print(notebooklm.__version__)")
          if [ "$got" != "$VERSION" ]; then
            echo "::error::${dist} installed but reported version ${got} (expected ${VERSION})"
            exit 1
          fi
          # Even the shims must leave all six commands on PATH, since the
          # canonical dist they pull in owns them.
          for cmd in notebooklm notebooklm-mcp notebooklm-server \
                     gemini-notebook gemini-notebook-mcp gemini-notebook-server; do
            test -x "venv-${dist}/bin/${cmd}" \
              || { echo "::error::${dist} install is missing ${cmd}"; exit 1; }
          done
          echo "OK: ${dist} -> import notebooklm ${got}, all six scripts present"
          echo "::endgroup::"
        done

    - name: Verify the shims ship no colliding files
      shell: bash
      run: |
        set -euo pipefail
        VERSION="${{ steps.version.outputs.version }}"
        for dist in notebooklm-py gemini-notebook; do
          # A shim RECORD that listed notebooklm/ files would mean the shim is
          # clobbering the canonical install — the exact hazard ADR-0028 ends.
          if "venv-${dist}/bin/python" - "$dist" <<'PY'
        import sys
        from importlib.metadata import Distribution
        files = Distribution.from_name(sys.argv[1]).files or []
        bad = [str(f) for f in files if str(f).startswith("notebooklm/")]
        print("shim package files:", bad)
        sys.exit(0 if bad else 1)
        PY
          then
            echo "::error::${dist} ships notebooklm/ package files; it must be metadata-only"
            exit 1
          fi
          echo "OK: ${dist} is metadata-only"
        done

    - name: Verify the dual-install collision warning and its remediation
      shell: bash
      run: |
        set -euo pipefail
        VERSION="${{ steps.version.outputs.version }}"
        # Stale-first: a pre-shim notebooklm-py already present, canonical
        # installed over it. The canonical files win, so our check runs and
        # must fire. (Stale-LAST is undetectable at runtime by construction —
        # the old release's code is what ends up executing — and is covered by
        # the release notes only. See ADR-0028 step 8.)
        rm -rf venv-stale && python -m venv venv-stale
        # 0.8.0 is the last release that shipped real files under the old name.
        venv-stale/bin/pip install --no-cache-dir "notebooklm-py==0.8.0"
        venv-stale/bin/pip install --no-cache-dir \
          "gemini-notebook-py==${VERSION}" ${{ inputs.source == 'testpypi' && '--index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/' || '' }}
        if ! venv-stale/bin/python -c "
        import logging, io
        stream = io.StringIO()
        logging.basicConfig(stream=stream, level=logging.WARNING)
        from notebooklm import _stale_install
        msg = _stale_install.stale_install_warning()
        assert msg, 'expected a collision warning in a stale-first dual install'
        assert '--force-reinstall' in msg, 'the warning must name the remediation'
        print('warning fired OK')
        "; then
          echo "::error::stale-first dual install did not produce the collision warning"
          exit 1
        fi
        # And the documented remediation must actually restore a working env.
        venv-stale/bin/pip uninstall -y notebooklm-py
        venv-stale/bin/pip install --no-cache-dir --force-reinstall \
          "gemini-notebook-py==${VERSION}" ${{ inputs.source == 'testpypi' && '--index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/' || '' }}
        got=$(venv-stale/bin/python -c "import notebooklm; print(notebooklm.__version__)")
        test "$got" = "$VERSION" || { echo "::error::remediation left version ${got}"; exit 1; }
        venv-stale/bin/python -c "
        from notebooklm import _stale_install
        assert _stale_install.stale_install_warning() is None, 'warning should clear after remediation'
        print('remediation verified')
        "

    - name: Verify isolated tool-installer flows (uvx / pipx)
      shell: bash
      run: |
        set -euo pipefail
        VERSION="${{ steps.version.outputs.version }}"
        python -m pip install --upgrade pipx uv
        PIPX_BIN="$(pipx environment --value PIPX_BIN_DIR)"

        # (a) The path baked into already-shipped desktop extensions. uvx
        #     resolves executables from the whole environment, so this keeps
        #     working even though the shim declares no scripts of its own.
        uvx --from "notebooklm-py[mcp]==${VERSION}" notebooklm-mcp --help > /dev/null
        echo "OK: uvx --from notebooklm-py[mcp] notebooklm-mcp"

        # (b) pipx exposes only the REQUESTED dist's entry points, so a plain
        #     shim install yields no commands. Both halves are asserted: the
        #     absence is what makes --include-deps necessary, and if a future
        #     change ever gave the shim its own scripts this would catch it.
        pipx install --force "notebooklm-py==${VERSION}"
        if [ -x "${PIPX_BIN}/notebooklm" ]; then
          echo "::error::plain pipx install of the shim exposed commands; the docs say it does not"
          exit 1
        fi
        echo "OK: plain pipx shim install exposes no commands (as documented)"
        pipx uninstall notebooklm-py
        pipx install --force --include-deps "notebooklm-py==${VERSION}"
        "${PIPX_BIN}/notebooklm" --version
        "${PIPX_BIN}/notebooklm-mcp" --help > /dev/null
        echo "OK: pipx --include-deps exposes the legacy commands"
        pipx uninstall notebooklm-py

        # (c) The recommended form for new tool installs.
        uv tool install --force "gemini-notebook-py==${VERSION}"
        uv tool run --from "gemini-notebook-py==${VERSION}" gemini-notebook --version
        echo "OK: uv tool install gemini-notebook-py"

    - name: Install Playwright browsers
      shell: bash
      run: |
        source .venv/bin/activate
        # Test deps come from the non-cookies extras installed via
        # `uv sync --frozen` above. Just need to provision the Chromium browser
        # binary + Linux system libs.
        playwright install chromium
        playwright install-deps chromium

    - name: Run unit tests
      shell: bash
      run: |
        source .venv/bin/activate
        pytest tests/unit -v

    - name: Run integration tests
      shell: bash
      run: |
        source .venv/bin/activate
        pytest tests/integration -v

    - name: Skip E2E tests (fork)
      if: github.repository != 'teng-lin/notebooklm-py'
      run: |
        echo "::warning::E2E tests skipped - secrets not available in fork repositories"
        echo "## E2E Tests Skipped" >> $GITHUB_STEP_SUMMARY
        echo "E2E tests were not run because this workflow is executing on a fork." >> $GITHUB_STEP_SUMMARY

    - name: Materialize auth profile
      if: github.repository == 'teng-lin/notebooklm-py'
      shell: bash
      env:
        NOTEBOOKLM_AUTH_JSON: ${{ secrets.NOTEBOOKLM_AUTH_JSON }}
        NOTEBOOKLM_MASTER_TOKEN_JSON: ${{ secrets.NOTEBOOKLM_MASTER_TOKEN_JSON }}
      run: |
        # Write the auth secrets to a real on-disk profile instead of handing
        # pytest an inline NOTEBOOKLM_AUTH_JSON env var. Env-var auth never
        # engages the layer-4 master-token re-mint (it only fires when
        # master_token.json sits BESIDE the profile's storage_state.json —
        # src/notebooklm/_auth/session.py), so a rotated cookie secret used to
        # hard-fail the run (e.g. run 30799508786). With a file-based profile
        # plus the optional NOTEBOOKLM_MASTER_TOKEN_JSON secret, expired
        # cookies are re-minted in-process and the job survives rotation.
        if [ -z "${NOTEBOOKLM_AUTH_JSON:-}" ]; then
          echo "::error::NOTEBOOKLM_AUTH_JSON secret is not configured"
          exit 1
        fi
        umask 077
        mkdir -p ~/.notebooklm/profiles/default
        printf '%s' "$NOTEBOOKLM_AUTH_JSON" > ~/.notebooklm/profiles/default/storage_state.json
        chmod 600 ~/.notebooklm/profiles/default/storage_state.json
        if [ -n "${NOTEBOOKLM_MASTER_TOKEN_JSON:-}" ]; then
          printf '%s' "$NOTEBOOKLM_MASTER_TOKEN_JSON" > ~/.notebooklm/profiles/default/master_token.json
          chmod 600 ~/.notebooklm/profiles/default/master_token.json
          # Pre-mint fresh cookies NOW: consumers that fetch tokens eagerly
          # (AuthTokens.from_storage in the e2e session fixture) raise on a
          # dead cookie snapshot BEFORE any client exists, so the in-client
          # layer-4 hook alone cannot rescue a stale secret at startup. The
          # explicit re-mint overwrites storage_state.json with a fresh
          # session; layer-4 then covers mid-run expiry. Non-fatal: if the
          # mint fails but the cookie snapshot is still live, the run can
          # proceed on cookies alone.
          # unset is load-bearing: `login` refuses to run while
          # NOTEBOOKLM_AUTH_JSON is set (env-var auth conflicts with
          # file-writing login), and both secrets are already on disk.
          unset NOTEBOOKLM_AUTH_JSON NOTEBOOKLM_MASTER_TOKEN_JSON
          source .venv/bin/activate
          if notebooklm login --master-token-refresh; then
            echo "Auth profile materialized (master token; fresh cookies minted)."
          else
            echo "::warning::master-token re-mint failed — proceeding with the cookie snapshot only."
          fi
        else
          echo "::warning::NOTEBOOKLM_MASTER_TOKEN_JSON secret is empty/absent — cookie-only profile (no rotation immunity)."
        fi

    - name: Run E2E tests
      id: e2e
      if: github.repository == 'teng-lin/notebooklm-py'
      # Don't fail the job here — the retry step below gets a 10-min cool-down
      # shot at any failures, and its exit code is what marks the job red.
      # Auth comes from the profile materialized above (NOT the inline
      # NOTEBOOKLM_AUTH_JSON env var) so the layer-4 re-mint can engage.
      continue-on-error: true
      shell: bash
      env:
        NOTEBOOKLM_READ_ONLY_NOTEBOOK_ID: ${{ secrets.NOTEBOOKLM_READ_ONLY_NOTEBOOK_ID }}
      run: |
        source .venv/bin/activate
        if [ -z "$NOTEBOOKLM_READ_ONLY_NOTEBOOK_ID" ]; then
          echo "::error::NOTEBOOKLM_READ_ONLY_NOTEBOOK_ID secret is not configured"
          exit 1
        fi
        # --reruns 1 --reruns-delay 30 catches sub-minute network blips;
        # longer chat-throttle recovery is handled by the cool-down retry below.
        pytest tests/e2e -m "not variants" --reruns 1 --reruns-delay 30 -v

    - name: Retry failed E2E tests after 10-min cool-down
      # Tests still throttled after the cool-down become skips via the
      # _install_chat_rate_limit_skip fixture in tests/e2e/conftest.py.
      if: steps.e2e.outcome == 'failure'
      shell: bash
      env:
        NOTEBOOKLM_READ_ONLY_NOTEBOOK_ID: ${{ secrets.NOTEBOOKLM_READ_ONLY_NOTEBOOK_ID }}
      run: |
        source .venv/bin/activate
        # Missing lastfailed after a failed e2e step means pytest crashed
        # before writing the cache (import error, OOM, etc.) — fail the job
        # rather than silently going green.
        if [ ! -f .pytest_cache/v/cache/lastfailed ]; then
          echo "::error::No lastfailed cache from previous step; pytest likely crashed before running tests."
          exit 1
        fi
        echo "Initial E2E run failed. Sleeping 600s before retrying failed tests."
        sleep 600
        uv run pytest tests/e2e --last-failed --last-failed-no-failures=none -s -v --tb=short
